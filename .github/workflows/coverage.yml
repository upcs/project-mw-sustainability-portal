name: Jest Coverage Report
on:
 pull_request:
   branches:
     - main
     - master
jobs:
 coverage:
   runs-on: ubuntu-latest
   steps:
     - uses: actions/checkout@v3
     - uses: ArtiomTr/jest-coverage-report-action@v2
       with:
         github-token: ${{ secrets.GITHUB_TOKEN }}
         test-script: npx jest --coverage
